plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)   // or 21 if you prefer
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Add your libraries here, for example:
    // implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'com.example.Main'   // change this to your main class
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
